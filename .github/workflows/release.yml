name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # Deliberately NOT upgrading npm here. Node 24.15.0's bundled npm
      # (11.12.1) already satisfies trusted publishing's npm>=11.5.1
      # requirement, and a newer one broke `pnpm publish --no-git-checks`,
      # which forwards that pnpm-only flag through to npm's own config
      # parser on some npm versions, which then rejects it as an unknown
      # flag (EUNKNOWNCONFIG). Confirmed locally with the bundled 11.12.1
      # — publish gets past that fine.
      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # On every push to main: if there are pending .changeset/*.md files,
      # opens/updates a "Version Packages" PR that applies them (bumps
      # package.json, writes CHANGELOG.md, deletes the consumed changesets)
      # — nothing is published yet. Merging that PR is itself a push to
      # main with no changesets left, which is what actually triggers the
      # publish step below.
      #
      # Publishes through npm's Trusted Publisher (OIDC): `id-token: write`
      # above plus the publisher configured on npmjs.com for this package
      # (GitHub Actions, helixid/helix-core, release.yml). No npm token is
      # involved — with NPM_TOKEN unset, changesets/action leaves auth to
      # npm, which exchanges the Actions OIDC token and attaches a
      # provenance attestation to the published version. This is the path
      # that has actually published since the last token expired (every
      # version from 3.0.0 on carries provenance); the token the workflow
      # used to pass was dead weight, so it is gone.
      #
      # The pnpm publish tool in @changesets/cli has a bug independent of
      # auth: its `pnpm info <pkg> --json` pre-check (what's already
      # published) assumes a plain object response, but pnpm sometimes
      # returns it array-wrapped (reproducible in CI, not locally). The
      # npm-tool equivalent in the same file already unwraps that array;
      # the pnpm one didn't, crashing getUnpublishedPackages (TypeError:
      # Cannot read properties of undefined (reading 'includes')). Patched
      # in patches/@changesets__cli@3.0.2.patch to add the same unwrapping.
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
