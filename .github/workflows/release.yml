name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # See ci.yml for why this is needed: @helixid/sdk-js is a devDependency
      # pinned via a git+path reference into the (currently private)
      # helix-sdk-js repo, e.g.:
      #   "@helixid/sdk-js": "github:helixid/helix-sdk-js#path:helix-sdk-js"
      # HELIXID_CROSS_REPO_TOKEN must be a PAT (classic, `repo` scope, or
      # fine-grained with contents:read) belonging to a user/machine account
      # with read access to helixid/helix-sdk-js, stored as a repo or org
      # secret. Remove this step once helix-sdk-js is public.
      - name: Configure git for private cross-repo dependency
        run: |
          git config --global --add url."https://${{ secrets.HELIXID_CROSS_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://${{ secrets.HELIXID_CROSS_REPO_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://${{ secrets.HELIXID_CROSS_REPO_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing needs npm >= 11.5.1; Node 24's bundled npm
      # may be older than that.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # On every push to main: if there are pending .changeset/*.md files,
      # opens/updates a "Version Packages" PR that applies them (bumps
      # package.json, writes CHANGELOG.md, deletes the consumed changesets)
      # — nothing is published yet. Merging that PR is itself a push to
      # main with no changesets left, which is what actually triggers the
      # publish step below.
      #
      # Uses a classic NPM_TOKEN — kept even though npm's OIDC Trusted
      # Publisher is configured for this package, since @changesets/cli's
      # pnpm publish tool has a real bug independent of auth method: its
      # `pnpm info <pkg> --json` pre-check (checking what's already
      # published) assumes a plain object response, but pnpm sometimes
      # returns it array-wrapped (confirmed via a debug run against this
      # exact repo/token — reproducible in CI, not locally). The npm-tool
      # equivalent in the same file already defensively unwraps that
      # array; the pnpm one didn't, crashing getUnpublishedPackages
      # (TypeError: Cannot read properties of undefined (reading
      # 'includes')). Patched in patches/@changesets__cli@3.0.2.patch to
      # add the same unwrapping. NPM_TOKEN itself is unrelated to that bug
      # — it's here because changesets/action's own OIDC path is a
      # separate, less-travelled code path (see open npm/cli#8976,
      # changesets/action#515) not worth debugging on top of the pnpm
      # bug; a classic token sidesteps it.
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
